# minecraft — game server (Java Edition).
# Servidor de Minecraft que persiste el mundo en ./data. Se conecta por IP:25565.
# Para restringir quién entra: activar whitelist, o exponerlo solo por la red malla
# privada (Tailscale) en vez de la IP pública.

name: minecraft

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"                       # puerto estándar de Minecraft Java
    environment:
      EULA: "TRUE"                          # aceptar EULA de Mojang (obligatorio)
      MOTD: "Estigia Server"                # texto que se ve en la lista de servers
      DIFFICULTY: "normal"
      GAMEMODE: "survival"
      MAX_PLAYERS: "20"
      # ENABLE_WHITELIST: "true"            # descomentar para permitir solo a invitados
    volumes:
      - ./data:/data                        # el mundo y la config viven aquí
    networks:
      - minecraft-net

networks:
  minecraft-net:
    driver: bridge
