# Config de Prometheus: le dice CADA CUANTO y A QUIEN pedirle metricas.
# Los targets se referencian por nombre de servicio , o sea, el DNS interno de Docker. :D

global:
  scrape_interval: 15s          # cada 15s va a preguntar las metricas

scrape_configs:
  - job_name: 'prometheus'      # se mide a si mismo
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'            # metricas del host (CPU, RAM, temperatura)
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'        # metricas por contenedor
    static_configs:
      - targets: ['cadvisor:8080']
