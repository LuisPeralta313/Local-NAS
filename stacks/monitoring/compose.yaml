# monitoring — observabilidad del server (metricas + dashboards).
# Cuatro piezas que trabajan juntas:
#   - prometheus:    recolecta y guarda las metricas en el tiempo (el cerebro).
#   - node-exporter: expone metricas del HOST (CPU, RAM, disco, temperatura).
#   - cadvisor:      expone metricas por CONTENEDOR (cuanto consume cada stack).
#   - grafana:       los dashboards que leo en el navegador (lee de prometheus).
# Todo vive en la red "monitoring-net" y se ven por nombre (DNS interno de Docker).
# --> Prometheus necesita su archivo ./prometheus/prometheus.yml que le dice a quien medir.

name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"                         # UI de Prometheus (Status > Targets)
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus         # datos historicos persistentes
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host                               # ve los procesos del host
    volumes:
      - /:/host:ro,rslave                   # lee el sistema real, en solo-lectura
    networks:
      - monitoring-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true                        # cadvisor necesita esto para leer contenedores
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"                         # UI web de Grafana
    volumes:
      - grafana-data:/var/lib/grafana       # dashboards y config persistentes
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring-net:
    driver: bridge
